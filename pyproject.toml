[project]
name = "udemy-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "SUJITH PEDAPATI", email = "pedapatisujith@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "docx2txt>=0.9",
    "faiss-cpu>=1.15.0",
    "ipykernel>=7.3.0",
    "langchain>=1.3.15",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.5.1",
    "langchain-text-splitters>=1.1.2",
    "pandas>=3.0.5",
    "pymupdf>=1.28.2",
    "pypdf>=6.16.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=5.7.0",
    "tiktoken>=0.13.0",
    "unstructured[docx]>=0.27.1",
]

[project.scripts]
udemy-rag = "udemy_rag:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
